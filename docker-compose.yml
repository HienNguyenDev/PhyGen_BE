services:
  phygen.api:
    image: ${DOCKER_REGISTRY-}phygenapi
    container_name: PhyGen.Api
    build:
      context: .
      dockerfile: PhyGen.Api/Dockerfile
    ports:
      - "5152:8080"  
      - "7165:8081" 
    volumes:
      - ./https:/https 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://0.0.0.0:8081;http://0.0.0.0:8080
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/dev-cert.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=123456
